[extend]
useDefault = true

[[rules]]
id = "browser-session-state"
description = "Browser authentication state must remain outside Git"
path = '''(^|/)\.auth/[^/]+\.json$'''
regex = '''(?s).+'''

[allowlist]
description = "Known vendored and runtime-test false positives"
paths = [
	'''(^|/)\.yarn/releases/yarn-3\.6\.1\.cjs$''',
	'''(^|/)(\.backups|\.build|\.dart_tool|\.git|\.next|\.open-next|\.wrangler|build|coverage|dist|node_modules)(/|$)''',
	'''(^|/)\.yarn/cache(/|$)''',
]
regexes = [
	'''^attachments/foreign$''',
	'''^(GetApiV1AppBannersByIdApiArg|PutApiV1AppBannersByIdApiArg|GetApiV1LogsSignInByIdApiArg|PutApiV1SamlIdpsByIdApiArg)$''',
]
