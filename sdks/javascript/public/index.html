<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library Example</title>
  </head>
  <style>
    body {
      background-color: white;
    }
  </style>
  <body>
    <script src="/dist/opengrow.js"></script>

    <script>
      const runtimeConfig = window.__OPENGROW_CONFIG__;
      if (!runtimeConfig?.projectKey || !runtimeConfig?.sdkOrigin) {
        throw new Error("Inject __OPENGROW_CONFIG__ before loading the OpenGrow example");
      }

      const sdk = new OpenGrow.default(
        runtimeConfig.projectKey,
        Boolean(runtimeConfig.testEnvironment),
        (data) => {
          console.log("Link data:", data);
        },
        runtimeConfig.sdkOrigin,
      );

      sdk.start(() => {
        console.log("started");
        sdk.setUserAttributes({ test: "web" });
      });

      function getLink() {
        sdk.createLink(
          "Test Title",
          "Test Subtitle",
          runtimeConfig.previewImageUrl,
          { invited_by: "test" },
          (successData) => {
            console.log("Link created successfully:", successData);
          },
          (errorData) => {
            console.error("Error creating link:", errorData);
          }
        );
      }
      setTimeout(getLink, 2000);
    </script>
  </body>
</html>
