name: opengrow_flutterflow
description: FlutterFlow-ready actions and paywall widgets for OpenGrow Purchases.
version: 2.2.5
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  http: ">=1.2.0 <2.0.0"
  opengrow_flutter:
    path: ../flutter
  url_launcher: ">=6.3.1 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
