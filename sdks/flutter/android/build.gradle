group = "io.opengrow.wrapper"
version = "1.0-SNAPSHOT"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-parcelize"

android {
    // The native SDK sources are embedded in the Flutter plugin so a separate
    // Maven credential is never required by FlutterFlow's remote builder.
    namespace = "io.opengrow"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += [
            "src/main/kotlin",
            "../../android/OpenGrow/OpenGrow/src/main/java"
        ]
        main.res.srcDirs += "../../android/OpenGrow/OpenGrow/src/main/res"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "../../android/OpenGrow/OpenGrow/consumer-rules.pro"
        buildConfigField "String", "TEST_SERVER_URL", "\"http://localhost:8080/\""
        buildConfigField "String", "SDK_VERSION", "\"1.1.1\""
        buildConfigField "boolean", "NETWORK_LOGGING", "false"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    dependencies {
        compileOnly files("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")
        compileOnly("com.google.firebase:firebase-messaging-ktx:24.0.3")

        implementation("androidx.core:core-ktx:1.13.1")
        implementation("androidx.appcompat:appcompat:1.5.0")
        implementation("com.google.android.material:material:1.12.0")
        implementation("androidx.constraintlayout:constraintlayout:2.1.0")
        implementation("androidx.lifecycle:lifecycle-process:2.3.0")
        implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.3.0")
        implementation("androidx.lifecycle:lifecycle-livedata-core-ktx:2.3.0")
        implementation("androidx.navigation:navigation-fragment-ktx:2.8.3")
        implementation("androidx.navigation:navigation-ui-ktx:2.8.3")
        implementation("com.android.installreferrer:installreferrer:2.1")

        implementation("com.squareup.retrofit2:retrofit:2.9.0")
        implementation("com.squareup.retrofit2:converter-gson:2.9.0")
        implementation("com.google.code.gson:gson:2.9.0")
        implementation("com.squareup.okhttp3:okhttp:4.9.0")
        implementation("com.squareup.okhttp3:logging-interceptor:4.9.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
