import groovy.json.JsonSlurper

pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'superboardwrapper.example'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Resolve the released coordinate through the local Android SDK build when
// validating this monorepo example. The package name stays catalog-driven, so
// this substitution fails closed if the native contract changes.
def superBoardNativeContract = new JsonSlurper().parse(file('../../plugin/native-contract.json'))
def superBoardAndroidSource = file('../../../android/SuperBoard')
includeBuild(superBoardAndroidSource) {
    dependencySubstitution {
        substitute module(superBoardNativeContract.android.packageName) using project(':SuperBoard')
    }
}
