name: grow_reference
description: Executable Flutter and FlutterFlow reference application for OpenGrow.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.38.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  opengrow_flutterflow:
    git:
      url: https://github.com/mbzadev/opengrow-platform.git
      ref: sdk-flutterflow-v2.2.4
      path: sdks/flutterflow
  opengrow_flutterflow_messaging:
    git:
      url: https://github.com/mbzadev/opengrow-platform.git
      ref: sdk-flutterflow-messaging-v1.3.0
      path: sdks/flutterflow_messaging
  url_launcher: ">=6.3.1 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
