name: SuperBoard installation button

on:
  push:
    branches: [main]
    paths:
      - scripts/cloudflare/installer-launcher.mjs
      - .github/workflows/installer-launcher.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: superboard-installer-pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.SUPERBOARD_INSTALLER_ORIGIN != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: node scripts/cloudflare/installer-launcher.mjs
        env:
          SUPERBOARD_INSTALLER_ORIGIN: ${{ vars.SUPERBOARD_INSTALLER_ORIGIN }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: infra/generated/installer-launcher
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
