name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Security and change plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENGROW_REFERENCE_ROOT: ${{ github.workspace }}/.ci-reference-contract
    outputs:
      api: ${{ steps.changes.outputs.api }}
      billing: ${{ steps.changes.outputs.billing }}
      messaging: ${{ steps.changes.outputs.messaging }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workers: ${{ steps.changes.outputs.workers }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
      flutter: ${{ steps.changes.outputs.flutter }}
      flutterflow: ${{ steps.changes.outputs.flutterflow }}
      flutterflow_messaging: ${{ steps.changes.outputs.flutterflow_messaging }}
      flutter_packages: ${{ steps.changes.outputs.flutter_packages }}
      ios: ${{ steps.changes.outputs.ios }}
      android: ${{ steps.changes.outputs.android }}
      javascript: ${{ steps.changes.outputs.javascript }}
      react_native: ${{ steps.changes.outputs.react_native }}
      node_sdks: ${{ steps.changes.outputs.node_sdks }}
      native_sdks: ${{ steps.changes.outputs.native_sdks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve reference contract source
        id: reference-contract
        run: node .github/scripts/ci-reference-contract.mjs
      - name: Check out reference contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.reference-contract.outputs.repository }}
          ref: ${{ steps.reference-contract.outputs.ref }}
          path: .ci-reference-contract
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test change planner
        run: node --test .github/scripts/*.test.mjs
      - name: Select affected checks
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/ci-change-plan.sh
      - name: Validate product copy
        run: node scripts/check-product-copy.mjs
      - name: Validate SDK and FlutterFlow catalogues
        run: npm run sdk:catalog:check && npm run sdk:catalog:test && npm run sdk:documentation:check && npm run flutterflow:source:test && npm run flutterflow-library:check && npm run flutterflow-applications:check
      - name: Validate Cloudflare and GitHub control planes
        run: npm run migration:inventory && npm run migration:inventory:test && npm run cloudflare:test:targets && npm run cloudflare:test:services
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workers:
    name: Affected Workers
    needs: plan
    if: needs.plan.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated Cloudflare binding types
        run: npm run cloudflare:types:check
      - name: Validate API Worker
        if: needs.plan.outputs.api == 'true'
        run: npm run worker:check
      - name: Validate Billing Worker
        if: needs.plan.outputs.billing == 'true'
        run: npm run billing:check
      - name: Validate legacy Messaging compatibility
        if: needs.plan.outputs.messaging == 'true'
        run: npm run legacy-messaging:check
      - name: Validate common and domain Workers
        run: |
          npm run email:check
          npm run identity:check
          npm run files:check
          npm run observability:check
          npm run mcp:check
          npm run modules:check
          npm run custom:check:all
          npm run chatwoot:test

  dashboard:
    name: Dashboard OpenNext
    needs: plan
    if: needs.plan.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dashboard:typecheck
      - run: npm run dashboard:test
      - run: npm run cloudflare:config:dashboard:reference
      - run: npm run dashboard:cf-build:reference

  flutter:
    name: Affected Flutter packages
    needs: plan
    if: needs.plan.outputs.flutter_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter SDK
        if: needs.plan.outputs.flutter == 'true'
        run: flutter pub get
        working-directory: sdks/flutter
      - name: Analyze Flutter SDK
        if: needs.plan.outputs.flutter == 'true'
        run: flutter analyze
        working-directory: sdks/flutter
      - name: Test Flutter SDK
        if: needs.plan.outputs.flutter == 'true'
        run: flutter test
        working-directory: sdks/flutter
      - name: Resolve FlutterFlow library
        if: needs.plan.outputs.flutterflow == 'true'
        run: flutter pub get
        working-directory: sdks/flutterflow
      - name: Analyze FlutterFlow library
        if: needs.plan.outputs.flutterflow == 'true'
        run: flutter analyze
        working-directory: sdks/flutterflow
      - name: Test FlutterFlow library
        if: needs.plan.outputs.flutterflow == 'true'
        run: flutter test
        working-directory: sdks/flutterflow
      - name: Resolve FlutterFlow Messaging library
        if: needs.plan.outputs.flutterflow_messaging == 'true'
        run: flutter pub get
        working-directory: sdks/flutterflow_messaging
      - name: Analyze FlutterFlow Messaging library
        if: needs.plan.outputs.flutterflow_messaging == 'true'
        run: flutter analyze
        working-directory: sdks/flutterflow_messaging
      - name: Test FlutterFlow Messaging library
        if: needs.plan.outputs.flutterflow_messaging == 'true'
        run: flutter test
        working-directory: sdks/flutterflow_messaging

  node_sdks:
    name: Affected JavaScript and React Native SDKs
    needs: plan
    if: needs.plan.outputs.node_sdks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate JavaScript SDK
        if: needs.plan.outputs.javascript == 'true'
        run: npm ci && npm run check
        working-directory: sdks/javascript
      - name: Enable Corepack for React Native
        if: needs.plan.outputs.react_native == 'true'
        run: corepack enable
      - name: Install repository tooling for the React Native contract
        if: needs.plan.outputs.react_native == 'true'
        run: npm ci --ignore-scripts
      - name: Validate React Native native dependency contract
        if: needs.plan.outputs.react_native == 'true'
        run: npm run react-native:native-contract:check
      - name: Install React Native dependencies
        if: needs.plan.outputs.react_native == 'true'
        run: yarn install --immutable
        working-directory: sdks/react-native
      - name: Typecheck, test and package React Native SDK
        if: needs.plan.outputs.react_native == 'true'
        run: yarn typecheck && yarn test --runInBand && yarn prepare
        working-directory: sdks/react-native

  ios_sdk:
    name: Affected iOS SDK
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test iOS SDK
        run: ./scripts/run_tests.sh
        working-directory: sdks/ios

  android_sdk:
    name: Affected Android SDK
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Test Android SDK
        run: ./gradlew :OpenGrow:testDebugUnitTest
        working-directory: sdks/android/OpenGrow

  validation-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [plan, workers, dashboard, flutter, node_sdks, ios_sdk, android_sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      WORKERS_RESULT: ${{ needs.workers.result }}
      DASHBOARD_RESULT: ${{ needs.dashboard.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      NODE_SDKS_RESULT: ${{ needs.node_sdks.result }}
      IOS_SDK_RESULT: ${{ needs.ios_sdk.result }}
      ANDROID_SDK_RESULT: ${{ needs.android_sdk.result }}
    steps:
      - name: Require every selected validation to pass
        run: |
          test "$PLAN_RESULT" = "success"
          for result in "$WORKERS_RESULT" "$DASHBOARD_RESULT" "$FLUTTER_RESULT" "$NODE_SDKS_RESULT" "$IOS_SDK_RESULT" "$ANDROID_SDK_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
