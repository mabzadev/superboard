name: Deploy OpenGrow to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Resolve deployment matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.selection.outputs.branch }}
      sha: ${{ steps.selection.outputs.sha }}
      matrix: ${{ steps.selection.outputs.matrix }}
      reference_environment: ${{ steps.selection.outputs.reference_environment }}
      deploy: ${{ steps.revision.outputs.deploy }}
    env:
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Restrict deployments to successful long-lived branch revisions
        run: |
          case "$DEPLOY_BRANCH" in
            dev|main) ;;
            *) exit 64 ;;
          esac
          test -n "$DEPLOY_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require successful aggregate CI for a manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "branch=$DEPLOY_BRANCH" \
            -f per_page=100 > "$RUNNER_TEMP/opengrow-ci-runs.json"
          test "$(jq --arg sha "$DEPLOY_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length' \
            "$RUNNER_TEMP/opengrow-ci-runs.json")" -ge 1
      - name: Reject a superseded automatic revision before expanding the matrix
        id: revision
        env:
          AUTOMATIC_DEPLOYMENT: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "$AUTOMATIC_DEPLOYMENT" != "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$DEPLOY_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Revision $DEPLOY_SHA was superseded on $DEPLOY_BRANCH; deployment skipped."
          fi
      - name: Select every declared deployment for this branch
        id: selection
        run: |
          node scripts/github-deployment-matrix.mjs \
            --branch "$DEPLOY_BRANCH" > "$RUNNER_TEMP/opengrow-deployments.json"
          echo "branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c '.matrix' "$RUNNER_TEMP/opengrow-deployments.json")" >> "$GITHUB_OUTPUT"
          echo "reference_environment=$(jq -r '.referenceEnvironment' "$RUNNER_TEMP/opengrow-deployments.json")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    name: ${{ matrix.id }} deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.githubEnvironment }}
    env:
      DEPLOY_BRANCH: ${{ needs.plan.outputs.branch }}
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
      OPENGROW_TARGET: ${{ vars.OPENGROW_TARGET }}
      OPENGROW_EXPECTED_TARGET: ${{ matrix.target }}
      OPENGROW_ENVIRONMENT: ${{ matrix.cloudflareEnvironment }}
      OPENGROW_REFERENCE_ROOT: ${{ github.workspace }}/.ci-reference-contract
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Restrict deployments to successful long-lived branch revisions
        run: |
          case "$DEPLOY_BRANCH" in
            dev|main) ;;
            *) exit 64 ;;
          esac
          test -n "$DEPLOY_SHA"
          test -n "$OPENGROW_EXPECTED_TARGET"
          test "$OPENGROW_TARGET" = "$OPENGROW_EXPECTED_TARGET"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reject a superseded automatic revision
        id: revision
        env:
          AUTOMATIC_DEPLOYMENT: ${{ github.event_name == 'workflow_run' }}
        run: |
          echo "branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$AUTOMATIC_DEPLOYMENT" != "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$DEPLOY_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Revision $DEPLOY_SHA was superseded on $DEPLOY_BRANCH; deployment skipped."
          fi
      - name: Resolve reference contract source
        if: steps.revision.outputs.deploy == 'true'
        id: reference-contract
        run: node .github/scripts/ci-reference-contract.mjs
      - name: Check out reference contract
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.reference-contract.outputs.repository }}
          ref: ${{ steps.reference-contract.outputs.ref }}
          path: .ci-reference-contract
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.revision.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.revision.outputs.deploy == 'true'
        run: npm ci
      - name: Validate target, generated bindings and deployment order
        if: steps.revision.outputs.deploy == 'true'
        run: |
          test -n "$OPENGROW_TARGET"
          npm run cloudflare:test:targets
          npm run cloudflare:test:services
          npm run cloudflare:types:check:target -- \
            --target "$OPENGROW_TARGET" \
            --environment "$OPENGROW_ENVIRONMENT"
          npm run cloudflare:deploy:all -- --plan
      - name: Validate custom Worker implementations
        if: steps.revision.outputs.deploy == 'true'
        run: npm run custom:check
      - name: Validate platform code
        if: steps.revision.outputs.deploy == 'true'
        run: npm run typecheck && npm test
      - name: Enforce staged or receipt-bound public routing
        if: steps.revision.outputs.deploy == 'true'
        run: npm run cloudflare:routing:check
      - name: Verify public domain ownership without mutation
        if: steps.revision.outputs.deploy == 'true'
        run: npm run cloudflare:domains:plan -- --strict
      - name: Verify required Cloudflare secret names without exposing values
        if: steps.revision.outputs.deploy == 'true'
        run: npm run cloudflare:secrets:check
      - name: Validate the production backup encryption key before mutation
        if: steps.revision.outputs.deploy == 'true' && env.OPENGROW_ENVIRONMENT == 'production'
        env:
          OPENGROW_BACKUP_ENCRYPTION_KEY: ${{ secrets.OPENGROW_BACKUP_ENCRYPTION_KEY }}
        run: npm run cloudflare:d1:key:check
      - name: Recheck automatic revision immediately before deployment
        if: steps.revision.outputs.deploy == 'true' && github.event_name == 'workflow_run'
        run: |
          git fetch --no-tags origin "refs/heads/$DEPLOY_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA"
      - name: Upload isolated production preflight versions
        if: steps.revision.outputs.deploy == 'true' && env.OPENGROW_ENVIRONMENT == 'production'
        run: npm run cloudflare:deploy:all -- --preflight --upload-only
      - name: Migrate, verify Identity project cutover receipt and deploy all enabled Workers
        id: deploy-workers
        if: steps.revision.outputs.deploy == 'true'
        run: |
          if [ "$OPENGROW_ENVIRONMENT" = "production" ]; then
            npm run cloudflare:deploy:all -- --backup-directory "$RUNNER_TEMP/opengrow-d1-backups"
          else
            npm run cloudflare:deploy:all
          fi
      - name: Encrypt production D1 migration backups
        id: encrypt-backups
        if: ${{ always() && env.OPENGROW_ENVIRONMENT == 'production' && steps.deploy-workers.outcome != 'skipped' }}
        env:
          OPENGROW_BACKUP_ENCRYPTION_KEY: ${{ secrets.OPENGROW_BACKUP_ENCRYPTION_KEY }}
          DEPLOY_WORKERS_OUTCOME: ${{ steps.deploy-workers.outcome }}
        run: |
          if [ "$DEPLOY_WORKERS_OUTCOME" = "success" ]; then
            npm run cloudflare:d1:encrypt -- \
              --directory "$RUNNER_TEMP/opengrow-d1-backups" \
              --require-batch-receipt
          else
            npm run cloudflare:d1:encrypt -- \
              --directory "$RUNNER_TEMP/opengrow-d1-backups"
          fi
      - name: Retain production D1 migration backups
        if: ${{ always() && env.OPENGROW_ENVIRONMENT == 'production' && steps.encrypt-backups.outcome == 'success' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opengrow-d1-backups-${{ matrix.id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/opengrow-d1-backups/**/*.enc
            ${{ runner.temp }}/opengrow-d1-backups/encrypted-backups.index.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain any recoverable encrypted backup after encryption failure
        if: ${{ always() && env.OPENGROW_ENVIRONMENT == 'production' && steps.encrypt-backups.outcome == 'failure' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opengrow-d1-recovery-${{ matrix.id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/opengrow-d1-backups/**/*.enc
            ${{ runner.temp }}/opengrow-d1-backups/encrypted-backups.index.json
          if-no-files-found: warn
          retention-days: 30

  trigger-reference-acceptance:
    if: ${{ needs.plan.outputs.deploy == 'true' && needs.deploy.result == 'success' && needs.plan.outputs.branch == 'dev' && needs.plan.outputs.reference_environment != '' }}
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.plan.outputs.reference_environment }}
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ secrets.OPENGROW_REFERENCE_DISPATCH_TOKEN }}
      OPENGROW_REFERENCE_REPOSITORY: ${{ vars.OPENGROW_REFERENCE_REPOSITORY }}
    steps:
      - name: Validate cross-repository dispatch configuration
        run: |
          test -n "$GH_TOKEN"
          test -n "$OPENGROW_REFERENCE_REPOSITORY"
          test -n "$DEPLOY_SHA"
          case "$OPENGROW_REFERENCE_REPOSITORY" in
            */*) ;;
            *) exit 64 ;;
          esac
      - name: Trigger exact reference acceptance build
        run: |
          gh api --method POST "repos/$OPENGROW_REFERENCE_REPOSITORY/dispatches" \
            --raw-field event_type=platform-dev-updated \
            --raw-field "client_payload[platform_sha]=$DEPLOY_SHA"
