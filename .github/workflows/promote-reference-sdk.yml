name: Promote SDK set to SuperBoard Reference

on:
  push:
    branches: [dev]
    paths:
      - config/sdk-libraries.json
      - .github/workflows/promote-reference-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-sdk-set-promotion
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ready: ${{ steps.sdk-set.outputs.ready }}
      catalogue_sha: ${{ steps.sdk-set.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install repository tooling for the SDK catalogue
        run: npm ci --ignore-scripts
      - name: Validate the complete SDK catalogue
        run: |
          node scripts/sdk-catalog.mjs check
          node scripts/sdk-documentation.mjs check
      - name: Resolve whether the complete FlutterFlow SDK set is published
        id: sdk-set
        run: |
          ready="$(node - <<'NODE'
          const catalogue = require('./config/sdk-libraries.json');
          const libraries = catalogue.libraries.filter((library) =>
            library.lifecycle === 'active' &&
            library.ecosystem === 'FlutterFlow'
          );
          const ready = libraries.length > 0 && libraries.every((library) =>
              library.releaseStatus === 'released' &&
              library.sourceVersion === library.latestReleaseVersion
          );
          process.stdout.write(String(ready));
          NODE
          )"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify every immutable SDK tag and GitHub release
        if: ${{ steps.sdk-set.outputs.ready == 'true' }}
        run: |
          for library in $(node -p "require('./config/sdk-libraries.json').libraries.filter((item) => item.lifecycle === 'active' && item.ecosystem === 'FlutterFlow').map((item) => item.id).join(' ')"); do
            tag="$(node scripts/sdk-catalog.mjs release-tag --library "$library")"
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git merge-base --is-ancestor "refs/tags/$tag^{}" HEAD
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: ${{ steps.sdk-set.outputs.ready == 'true' }}
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - name: Promote the embedded reference application
        if: ${{ steps.sdk-set.outputs.ready == 'true' }}
        env:
          CATALOGUE_SHA: ${{ steps.sdk-set.outputs.sha }}
        run: |
          branch="automation/sdk-set-${CATALOGUE_SHA:0:12}"
          git switch --create "$branch"
          node apps/reference/scripts/reference-sdk-promotion.mjs \
            --catalog config/sdk-libraries.json \
            --library all
          (cd apps/reference && flutter pub get)
          npm --prefix apps/reference ci
          npm --prefix apps/reference run config:test
          if git diff --quiet -- apps/reference; then
            echo "Embedded Reference already consumes the published SDK set."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/reference/reference.project.json \
            apps/reference/pubspec.yaml \
            apps/reference/pubspec.lock \
            apps/reference/flutterflow/dependency-snippet.yaml \
            apps/reference/config/sdk-coverage.json
          git commit -m "chore(sdk): promote the published SuperBoard SDK set"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base dev \
            --head "$branch" \
            --title "chore(sdk): promote the published SuperBoard SDK set" \
            --body "Updates the embedded reference application from the reviewed lifecycle catalogue."

  sync-development-library:
    needs: dispatch
    if: ${{ needs.dispatch.outputs.ready == 'true' }}
    uses: ./.github/workflows/sync-flutterflow-library.yml
    with:
      source_ref: ${{ needs.dispatch.outputs.catalogue_sha }}
    secrets: inherit
