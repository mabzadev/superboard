name: Front menu checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  front-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=2048
      GOMAXPROCS: "1"
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build front test dependencies sequentially
        run: |
          pnpm --filter '@emdash-cms/admin...' build
          pnpm --filter '@superboard/site^...' --workspace-concurrency=1 -r build
      - name: Validate menu authority, languages, and native cache invalidation
        run: pnpm check:front-menu
