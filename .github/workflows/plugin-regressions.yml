name: Plugin regression checks

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: plugin-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [local, development, artifact]
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=2048
      GOMAXPROCS: "1"
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build test dependencies
        run: |
          pnpm --filter '@superboard/site^...' --filter '@superboard/email-worker^...' --workspace-concurrency=1 -r build
          pnpm -r --filter @superboard/plugin-* build
      - name: Check plugin behavior and deployment artifacts
        run: pnpm run test:plugins:${{ matrix.check }}
