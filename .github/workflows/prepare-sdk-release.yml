name: Prepare immutable SuperBoard SDK release

on:
  workflow_dispatch:
    inputs:
      library:
        description: Library declared ready in config/sdk-libraries.json
        required: true
        type: choice
        options:
          - flutter
          - flutterflow
      source_ref:
        description: Exact reviewed head of the catalogue development branch
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ inputs.library }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      development_branch: ${{ steps.source.outputs.development_branch }}
      tag: ${{ steps.release.outputs.tag }}
      release_ref: ${{ steps.release.outputs.release_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install repository tooling for the SDK catalogue
        run: npm ci --ignore-scripts
      - name: Verify complete SDK catalogue
        run: |
          node scripts/sdk-catalog.mjs check
          node scripts/sdk-documentation.mjs check
      - name: Require the exact official development head
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          development_branch="$(node -p 'require("./config/sdk-libraries.json").developmentBranch')"
          test "$SOURCE_REF" = "$development_branch" || [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/heads/$development_branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "development_branch=$development_branch" >> "$GITHUB_OUTPUT"
      - name: Resolve immutable release tag
        id: release
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          tag="$(node scripts/sdk-catalog.mjs candidate-tag --library "$LIBRARY")"
          release_ref="$(node scripts/sdk-catalog.mjs candidate-ref --library "$LIBRARY")"
          node scripts/sdk-catalog.mjs check --candidate-release-tag "$tag"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if test "$release_ref" != "$tag" && git ls-remote --exit-code --tags origin "refs/tags/$release_ref" >/dev/null 2>&1; then
            echo "Package reference already exists: $release_ref" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Validate the candidate Dart package before creating its tag
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          case "$LIBRARY" in
            flutter) package_path="sdks/flutter" ;;
            flutterflow) package_path="sdks/flutterflow" ;;
            *) exit 64 ;;
          esac
          (cd "$package_path" && flutter pub get && flutter analyze && flutter test)

      - name: Bind FlutterFlow to the published Flutter v3 source
        if: inputs.library == 'flutterflow'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          flutter_tag="$(node scripts/sdk-catalog.mjs candidate-ref --library flutter)"
          [[ "$flutter_tag" =~ ^sdk-flutter-v3\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin "refs/tags/$flutter_tag:refs/tags/$flutter_tag"
          flutter_sha="$(git rev-list -n 1 "$flutter_tag")"
          test "$flutter_sha" = "$SOURCE_SHA"
          test "$(git rev-parse "$flutter_tag:sdks/flutter")" = "$(git rev-parse "$SOURCE_SHA:sdks/flutter")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$flutter_tag" --jq .tag_name)" = "$flutter_tag"

  flutter-android-native:
    name: Build Flutter Android example before tagging
    if: inputs.library == 'flutter'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Compile the Android wrapper through the consumer example
        working-directory: sdks/flutter/example
        run: |
          flutter pub get
          flutter build apk --debug

  flutter-ios-native:
    name: Build Flutter iOS example on macOS before tagging
    if: inputs.library == 'flutter'
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve the example and its locked CocoaPods graph
        working-directory: sdks/flutter/example
        run: |
          flutter pub get
          pod install --project-directory=ios --deployment
      - name: Verify embedded Flutter iOS sources
        run: node --test scripts/flutter-ios-embedded-sources.test.mjs
      - name: Validate the public CocoaPods identity
        run: |
          pod ipc spec sdks/flutter/ios/superboard_flutter.podspec > "$RUNNER_TEMP/superboard_flutter.podspec.json"
          ruby -rjson -ryaml -e '
            spec = JSON.parse(File.read(ARGV.fetch(0)))
            package = YAML.safe_load(File.read(ARGV.fetch(1)), aliases: false)
            abort "unexpected pod name" unless spec.fetch("name") == "superboard_flutter"
            abort "pod/pub version mismatch" unless spec.fetch("version") == package.fetch("version")
          ' "$RUNNER_TEMP/superboard_flutter.podspec.json" sdks/flutter/pubspec.yaml
      - name: Compile the iOS pod target without requiring a simulator runtime
        run: |
          xcode_overrides=()
          destinations="$(xcodebuild \
            -workspace sdks/flutter/example/ios/Runner.xcworkspace \
            -scheme Runner \
            -showdestinations 2>&1)"
          if ! grep -q 'platform:iOS Simulator' <<< "$destinations"; then
            echo "No simulator destination is installed; compiling Swift while CocoaPods validates the XIB graph."
            xcode_overrides=('EXCLUDED_SOURCE_FILE_NAMES=*.xib')
          fi
          xcodebuild \
            -project sdks/flutter/example/ios/Pods/Pods.xcodeproj \
            -target superboard_flutter \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "${xcode_overrides[@]}" \
            build

  native-candidate-gate:
    name: Flutter native candidate gate
    if: ${{ always() }}
    needs: [validate, flutter-android-native, flutter-ios-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIBRARY: ${{ inputs.library }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      ANDROID_RESULT: ${{ needs.flutter-android-native.result }}
      IOS_RESULT: ${{ needs.flutter-ios-native.result }}
    steps:
      - name: Fail closed on the selected native validation contract
        run: |
          test "$VALIDATE_RESULT" = "success"
          case "$LIBRARY" in
            flutter)
              test "$ANDROID_RESULT" = "success"
              test "$IOS_RESULT" = "success"
              ;;
            flutterflow)
              test "$ANDROID_RESULT" = "skipped"
              test "$IOS_RESULT" = "skipped"
              ;;
            *) exit 64 ;;
          esac

  tag:
    needs: [validate, native-candidate-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      actions: write
      contents: write
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      DEVELOPMENT_BRANCH: ${{ needs.validate.outputs.development_branch }}
      TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
      LIBRARY: ${{ inputs.library }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install repository tooling for the SDK catalogue
        run: npm ci --ignore-scripts
      - name: Revalidate the reviewed source and unused immutable refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin "refs/heads/$DEVELOPMENT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          node scripts/sdk-catalog.mjs check --candidate-release-tag "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          if test "$RELEASE_REF" != "$TAG" && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_REF" >/dev/null 2>&1; then
            echo "Package reference already exists: $RELEASE_REF" >&2
            exit 1
          fi
          if test "$LIBRARY" = "flutterflow"; then
            flutter_tag="$(node scripts/sdk-catalog.mjs candidate-ref --library flutter)"
            [[ "$flutter_tag" =~ ^sdk-flutter-v3\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            git fetch --no-tags origin "refs/tags/$flutter_tag:refs/tags/$flutter_tag"
            flutter_sha="$(git rev-list -n 1 "$flutter_tag")"
            test "$flutter_sha" = "$SOURCE_SHA"
            test "$(git rev-parse "$flutter_tag:sdks/flutter")" = "$(git rev-parse "$SOURCE_SHA:sdks/flutter")"
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$flutter_tag" --jq .tag_name)" = "$flutter_tag"
          fi
      - name: Create reviewed SDK tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          if test "$RELEASE_REF" != "$TAG"; then
            git tag -a "$RELEASE_REF" -m "Package release $TAG"
            git push --atomic origin "refs/tags/$TAG" "refs/tags/$RELEASE_REF"
          else
            git push origin "refs/tags/$TAG"
          fi
      - name: Dispatch publication for the reviewed immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-sdk.yml --ref "$DEVELOPMENT_BRANCH" --field "release_tag=$TAG"
