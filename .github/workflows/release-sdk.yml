name: Release private SDK

on:
  push:
    tags:
      - sdk-flutter-v*
      - sdk-flutterflow-v*
      - sdk-ios-v*
      - sdk-android-v*
      - sdk-js-v*
      - sdk-react-native-v*

permissions:
  contents: write
  packages: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.tag.outputs.sdk }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          sdk="${tag#sdk-}"
          sdk="${sdk%-v*}"
          version="${tag##*-v}"
          test "$version" = "1.0.0" || [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  flutter:
    if: needs.validate-tag.outputs.sdk == 'flutter' || needs.validate-tag.outputs.sdk == 'flutterflow'
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: sdks/${{ needs.validate-tag.outputs.sdk }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate-tag.outputs.version, '-') }}

  ios:
    if: needs.validate-tag.outputs.sdk == 'ios'
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project sdks/ios/OpenGrow.xcodeproj -scheme OpenGrow -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  android:
    if: needs.validate-tag.outputs.sdk == 'android'
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: ./gradlew :OpenGrow:testDebugUnitTest :OpenGrow:publishReleasePublicationToGithubPackagesPrivateRepository -PlibraryVersion=${{ needs.validate-tag.outputs.version }}
        working-directory: sdks/android/OpenGrow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  npm:
    if: needs.validate-tag.outputs.sdk == 'js' || needs.validate-tag.outputs.sdk == 'react-native'
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mbzadev'
      - run: npm ci && npm run build
        if: needs.validate-tag.outputs.sdk == 'js'
        working-directory: sdks/javascript
      - run: corepack enable && yarn install --immutable && yarn prepare
        if: needs.validate-tag.outputs.sdk == 'react-native'
        working-directory: sdks/react-native
      - run: npm version ${{ needs.validate-tag.outputs.version }} --no-git-tag-version --allow-same-version && npm publish
        working-directory: sdks/${{ needs.validate-tag.outputs.sdk == 'js' && 'javascript' || 'react-native' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
