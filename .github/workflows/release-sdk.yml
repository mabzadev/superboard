name: Release SuperBoard SDK

on:
  push:
    tags:
      - sdk-flutter-v*
      - sdk-flutterflow-v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK tag created by the protected preparation workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-publication-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.tag.outputs.sdk }}
      version: ${{ steps.tag.outputs.version }}
      path: ${{ steps.tag.outputs.path }}
      development_branch: ${{ steps.tag.outputs.development_branch }}
      release_ref: ${{ steps.tag.outputs.release_ref }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install repository tooling for the SDK catalogue
        run: npm ci --ignore-scripts
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          sdk="${tag#sdk-}"
          sdk="${sdk%-v*}"
          version="${tag##*-v}"
          test "$version" = "1.0.0" || [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          path="$sdk"
          catalog_id="$sdk"
          development_branch="$(node -p 'require("./config/sdk-libraries.json").developmentBranch')"
          release_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$tag^{}")" = "$release_sha"
          git fetch --no-tags origin "refs/heads/$development_branch"
          git merge-base --is-ancestor "$release_sha" FETCH_HEAD
          release_ref="$(node scripts/sdk-catalog.mjs candidate-ref --library "$catalog_id")"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "development_branch=$development_branch" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify package, catalogue and immutable release version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/sdk-catalog.mjs check --candidate-release-tag "$RELEASE_TAG"
          node scripts/sdk-documentation.mjs check
      - name: Bind FlutterFlow to the already-published Flutter v3 source
        if: steps.tag.outputs.sdk == 'flutterflow'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.release_sha }}
        run: |
          flutter_tag="$(node scripts/sdk-catalog.mjs candidate-ref --library flutter)"
          [[ "$flutter_tag" =~ ^sdk-flutter-v3\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin "refs/tags/$flutter_tag:refs/tags/$flutter_tag"
          flutter_sha="$(git rev-list -n 1 "$flutter_tag")"
          test "$flutter_sha" = "$RELEASE_SHA"
          test "$(git rev-parse "$flutter_tag:sdks/flutter")" = "$(git rev-parse "$RELEASE_SHA:sdks/flutter")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$flutter_tag" --jq .tag_name)" = "$flutter_tag"

  authorize-publication:
    name: Authorize immutable SDK publication
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sdk-release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
    steps:
      - name: Bind approval to the validated immutable release
        run: |
          [[ "$RELEASE_TAG" =~ ^sdk-[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

  flutter:
    if: needs.validate-tag.outputs.sdk == 'flutter' || needs.validate-tag.outputs.sdk == 'flutterflow'
    needs: [validate-tag, authorize-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: sdks/${{ needs.validate-tag.outputs.path }}

  flutter-android-native:
    name: Build immutable Flutter Android example
    if: needs.validate-tag.outputs.sdk == 'flutter'
    needs: [validate-tag, authorize-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Compile the Android wrapper through the consumer example
        working-directory: sdks/flutter/example
        run: |
          flutter pub get
          flutter build apk --debug

  flutter-ios-native:
    name: Build immutable Flutter iOS example on macOS
    if: needs.validate-tag.outputs.sdk == 'flutter'
    needs: [validate-tag, authorize-publication]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve the example and its locked CocoaPods graph
        working-directory: sdks/flutter/example
        run: |
          flutter pub get
          pod install --project-directory=ios --deployment
      - name: Verify embedded Flutter iOS sources
        run: node --test scripts/flutter-ios-embedded-sources.test.mjs
      - name: Validate the public CocoaPods identity
        run: |
          pod ipc spec sdks/flutter/ios/superboard_flutter.podspec > "$RUNNER_TEMP/superboard_flutter.podspec.json"
          ruby -rjson -ryaml -e '
            spec = JSON.parse(File.read(ARGV.fetch(0)))
            package = YAML.safe_load(File.read(ARGV.fetch(1)), aliases: false)
            abort "unexpected pod name" unless spec.fetch("name") == "superboard_flutter"
            abort "pod/pub version mismatch" unless spec.fetch("version") == package.fetch("version")
          ' "$RUNNER_TEMP/superboard_flutter.podspec.json" sdks/flutter/pubspec.yaml
      - name: Compile the iOS pod target without requiring a simulator runtime
        run: |
          xcode_overrides=()
          destinations="$(xcodebuild \
            -workspace sdks/flutter/example/ios/Runner.xcworkspace \
            -scheme Runner \
            -showdestinations 2>&1)"
          if ! grep -q 'platform:iOS Simulator' <<< "$destinations"; then
            echo "No simulator destination is installed; compiling Swift while CocoaPods validates the XIB graph."
            xcode_overrides=('EXCLUDED_SOURCE_FILE_NAMES=*.xib')
          fi
          xcodebuild \
            -project sdks/flutter/example/ios/Pods/Pods.xcodeproj \
            -target superboard_flutter \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "${xcode_overrides[@]}" \
            build

  release-gate:
    name: SDK release gate
    if: ${{ always() }}
    needs: [validate-tag, authorize-publication, flutter, flutter-android-native, flutter-ios-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SDK: ${{ needs.validate-tag.outputs.sdk }}
      VALIDATE_RESULT: ${{ needs.validate-tag.result }}
      AUTHORIZATION_RESULT: ${{ needs.authorize-publication.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      ANDROID_RESULT: ${{ needs.flutter-android-native.result }}
      IOS_RESULT: ${{ needs.flutter-ios-native.result }}
    steps:
      - name: Require the selected publication job to pass
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$AUTHORIZATION_RESULT" = "success"
          case "$SDK" in
            flutter)
              test "$FLUTTER_RESULT" = "success"
              test "$ANDROID_RESULT" = "success"
              test "$IOS_RESULT" = "success"
              ;;
            flutterflow)
              test "$FLUTTER_RESULT" = "success"
              test "$ANDROID_RESULT" = "skipped"
              test "$IOS_RESULT" = "skipped"
              ;;
            *) exit 64 ;;
          esac

  publish-release:
    name: Publish immutable SDK GitHub release
    needs: [validate-tag, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate-tag.outputs.version, '-') }}

  propose-catalogue:
    needs: [validate-tag, release-gate, publish-release]
    # `release-gate` intentionally depends on every package job, most of which
    # are skipped for a single-library publication. Without always(), GitHub's
    # implicit success condition suppresses this downstream promotion even
    # after the explicit gate succeeds.
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.release-gate.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      SDK: ${{ needs.validate-tag.outputs.sdk }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
      TAG: ${{ needs.validate-tag.outputs.tag }}
      DEVELOPMENT_BRANCH: ${{ needs.validate-tag.outputs.development_branch }}
      RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROMOTION_BRANCH: automation/catalogue-${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.development_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install repository tooling for the SDK catalogue
        run: npm ci --ignore-scripts
      - name: Create the isolated catalogue promotion branch
        run: |
          if git fetch --no-tags origin "refs/heads/$PROMOTION_BRANCH"; then
            git checkout -B "$PROMOTION_BRANCH" FETCH_HEAD
          else
            git checkout -b "$PROMOTION_BRANCH"
          fi
      - name: Validate the release against the current catalogue head
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          catalog_id="$SDK"
          node scripts/sdk-catalog.mjs promote \
            --library "$catalog_id" \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --write
          node scripts/sdk-catalog.mjs check \
            --release-tag "$TAG" \
            --release-sha "$RELEASE_SHA"
          node scripts/sdk-documentation.mjs write
          node scripts/sdk-documentation.mjs check
      - name: Propose the published catalogue state through a protected PR
        run: |
          ensure_promotion_pr() {
            existing="$(gh pr list --state open --base "$DEVELOPMENT_BRANCH" --head "$PROMOTION_BRANCH" --json url --jq '.[0].url // empty')"
            if test -n "$existing"; then
              echo "Catalogue promotion PR already exists: $existing"
              return 0
            fi
            closed="$(gh pr list --state closed --base "$DEVELOPMENT_BRANCH" --head "$PROMOTION_BRANCH" --json number,mergedAt --jq 'map(select(.mergedAt == null))[0].number // empty')"
            if test -n "$closed"; then
              gh pr reopen "$closed"
              return 0
            fi
            gh pr create \
              --base "$DEVELOPMENT_BRANCH" \
              --head "$PROMOTION_BRANCH" \
              --title "chore(sdk): publish $TAG" \
              --body "Promotes the successfully tested immutable SDK tag $TAG into the canonical catalogue."
          }
          git fetch --no-tags origin \
            "refs/heads/$DEVELOPMENT_BRANCH:refs/remotes/origin/$DEVELOPMENT_BRANCH"
          if git diff --quiet; then
            if git merge-base --is-ancestor HEAD "origin/$DEVELOPMENT_BRANCH"; then
              echo "The development branch already records $TAG."
              exit 0
            fi
            ensure_promotion_pr
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sdk-libraries.json sdks/*/README.md
          git commit -m "chore(sdk): publish $TAG"
          git push --set-upstream origin "HEAD:refs/heads/$PROMOTION_BRANCH"
          ensure_promotion_pr
      - name: Trigger validation for the protected promotion branch
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$PROMOTION_BRANCH" >/dev/null 2>&1; then
            gh workflow run ci.yml --ref "$PROMOTION_BRANCH"
          else
            echo "No catalogue promotion branch is required for $TAG."
          fi
