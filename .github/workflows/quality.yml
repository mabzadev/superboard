name: Repository quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      GOMAXPROCS: "2"
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build type declarations
        run: |
          pnpm --filter '@emdash-cms/admin...' build
          pnpm --dir sdks/web build
          pnpm build
      # Every file the build creates or changes, except dependencies, so the
      # consumers start from exactly the state they would have built themselves.
      - name: Archive build outputs
        run: |
          {
            git ls-files -z --others --directory
            git diff -z --name-only --diff-filter=d
          } | grep -zv -E '(^|/)(node_modules|\.pnpm-store)(/|$)' > "$RUNNER_TEMP/build-outputs.list"
          tr '\0' '\n' < "$RUNNER_TEMP/build-outputs.list" | head -n 200
          tar -czf "$RUNNER_TEMP/build-outputs.tgz" --null -T "$RUNNER_TEMP/build-outputs.list"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-outputs
          path: ${{ runner.temp }}/build-outputs.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  source:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      GOMAXPROCS: "2"
      GOMEMLIMIT: 3GiB
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The migration and baseline comparisons only read the base commit's tree,
      # so the parent commit plus a targeted fetch of the base is enough.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore build outputs
        run: tar -xzf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Select migration comparison
        run: |
          base="$BASE_SHA"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] &&
            ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
            ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "SUPERBOARD_LINT_BASE=$base" >> "$GITHUB_ENV"
      - name: Check package and Site types
        run: pnpm typecheck
      - name: Check runtime route registrations and references
        run: pnpm routes:check
      - name: Check analyzers, source, dependencies and repository contracts
        run: pnpm lint && pnpm lint:contracts
      - name: Check navigation permissions and settings links
        run: pnpm test:navigation

  test:
    name: test (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [emdash, superboard]
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore build outputs
        run: tar -xzf "$RUNNER_TEMP/build-outputs.tgz"
      # The EmDash admin package runs its tests in Vitest browser mode.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite == 'emdash'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.suite == 'emdash' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the ${{ matrix.suite }} test suite
        run: pnpm run "$SUITE:test"
        env:
          SUITE: ${{ matrix.suite }}

  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install shell and workflow analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: pnpm lint:automation

  swift:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Swift analyzer
        run: |
          curl --fail --location --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: pnpm lint:swift

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the validated Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
          pub-cache: true
      - name: Verify the Flutter revision
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          test "$(git -C "$flutter_root" rev-parse HEAD)" = "67323de285b00232883f53b84095eb72be97d35c"
      - name: Resolve SDK analyzer dependencies
        run: |
          for sdk in flutter flutterflow; do
            (cd "sdks/$sdk" && flutter pub get)
          done
      - run: pnpm lint:dart

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Java 17 and the Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      # Caches the Gradle distribution and dependencies used by the project wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: pnpm lint:android
